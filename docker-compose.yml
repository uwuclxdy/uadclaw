secrets:
  postgres_password:
    file: ./secrets/postgres_password
  auth_password:
    file: ./secrets/auth_password
  session_secret:
    file: ./secrets/session_secret
  # Only the worker mounts this one: nothing the web service serves calls the model, and a
  # credential that buys tokens has no business inside the internet-facing container.
  deepseek_key:
    file: ./secrets/deepseek_key

volumes:
  postgres-data:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: uadclaw
      POSTGRES_DB: uadclaw
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # No published port, deliberately: internal-network-only, LAN exposure goes through
    # web. Run migrations from inside the network instead of the host:
    # `docker compose exec web alembic upgrade head`. Do not "fix" host-side alembic by
    # publishing 5432 — that widens this service's exposure to solve a workflow problem.
    # (Local dev/test DOES need host-side access — see docker-compose.override.yml, which
    # `docker compose` merges in automatically and which keeps this file honest about
    # what's actually deployed.)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uadclaw -d uadclaw"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    # A reclaim sweep runs inside the worker process, so a process that dies and stays
    # dead never recovers what it was holding; the compose layer has to bring it back.
    restart: unless-stopped
    ports:
      # WEB_BIND_ADDR lets the server pin this to its LAN interface (e.g. 192.168.1.10)
      # without editing the file; unset, it keeps today's behaviour (all interfaces).
      - "${WEB_BIND_ADDR:-0.0.0.0}:8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: uadclaw
      POSTGRES_DB: uadclaw
      COOKIE_SECURE: "false"
    secrets:
      - postgres_password
      - auth_password
      - session_secret
    depends_on:
      postgres:
        condition: service_healthy
    # --- hardening baseline (cloudify python/hardening.md) ---
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    user: "65532:65532"
    init: true
    mem_limit: 512m
    pids_limit: 200
    ulimits:
      nofile:
        soft: 1024
        hard: 2048
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run:size=8m,mode=755
    volumes:
      # The same read-only mount the worker gets, and it is not a copy-paste: the triage
      # screen shows the nearest existing `uad_lists.json` entries beside each proposal, so
      # the WEB service reads this file too. Without it the card degrades quietly, losing one
      # of the four things a reviewer compares against and raising nothing, which is the
      # failure mode that survives local testing untouched.
      - ./data:/data:ro

  worker:
    build: .
    command: ["python", "-m", "uadclaw.worker"]
    # Same reasoning as web: a dead worker process leaves the periodic in-process reclaim
    # sweep dead with it, so a job or lease it was holding never recovers without the
    # container itself restarting.
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: uadclaw
      POSTGRES_DB: uadclaw
    secrets:
      # `postgres_password` is not optional here and was missing until 2026-08-11: with no
      # secrets mounted, /run/secrets is empty, POSTGRES_PASSWORD is unset, and `Settings()`
      # raises before the worker's first line of work.
      - postgres_password
      # The classification stage's credential. Absent, every deterministic stage still runs
      # and only a `classification` job fails, naming this setting.
      - deepseek_key
    depends_on:
      postgres:
        condition: service_healthy
    # The web image's baked-in HEALTHCHECK probes localhost:8000/health, which the worker
    # never serves; disable it here rather than let it report permanently unhealthy.
    healthcheck:
      disable: true
    # --- hardening baseline, MINUS read-only rootfs ---
    # Deliberately NOT read_only: this service unpacks multi-GB firmware images and shells
    # out to extraction tools (task 3). tmpfs tops out around host RAM/2 and won't hold an
    # 8 GB image; it needs a real writable named volume instead. Do not "harden" this to
    # read_only without also solving where multi-GB scratch writes go.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    user: "65532:65532"
    init: true
    pids_limit: 200
    ulimits:
      nofile:
        soft: 1024
        hard: 2048
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      # Firmware-unpack scratch, a BIND MOUNT rather than a named volume: docker's volume
      # driver puts a named volume under /var/lib/docker, and one Samsung job peaks well past
      # what the root filesystem holds — the archive is 11.5-19.25 GB before it is opened.
      # WORKER_SCRATCH_DIR repoints it without editing this file; the default is the server's
      # 1.9 TB disk.
      #
      # A bind mount inherits the HOST directory's ownership, where a named volume would be
      # created with the container user's. So this is the one manual step it costs, and the
      # worker EACCESes on its first scratch write without it:
      #   sudo mkdir -p /mnt/ssd-1/scratch && sudo chown 65532:65532 /mnt/ssd-1/scratch
      # Host-side heavy tests write to UADCLAW_HEAVY_WORKDIR instead, so they do not want
      # this directory back.
      - ${WORKER_SCRATCH_DIR:-/mnt/ssd-1/scratch}:/scratch
      # The upstream `uad_lists.json` the filter stage reads, operator-supplied and read-only.
      # It decides which packages are already carried upstream, so it is deliberately a file
      # on disk rather than a fetch: a stage that downloaded its own filter input would change
      # what reaches triage between two runs of the same corpus with nothing recorded about
      # why. The loader records the copy's sha256 and mtime on every row it decides, and
      # refuses a missing or empty file. Refresh it deliberately:
      #   mkdir -p data && curl -fsSL -o data/uad_lists.json https://raw.githubusercontent.com/\
      #     Universal-Debloater-Alliance/universal-android-debloater-next-generation/main/\
      #     resources/assets/uad_lists.json
      - ./data:/data:ro
