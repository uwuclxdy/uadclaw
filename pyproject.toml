[project]
name            = "uadclaw"
version         = "0.1.0"
description     = "Automatic LLM-driven bloat classification of Android applications for UAD-ng"
requires-python = ">=3.12"
license         = { text = "MIT" }
dependencies = [
  "alembic>=1.19.1",
  "asyncpg>=0.31.0",
  "fastapi>=0.141.1",
  "itsdangerous>=2.2.0",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.15.0",
  "sqlalchemy[asyncio]>=2.0.51",
  "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-xdist",
  "pytest-timeout",
  "httpx",
  "ruff",
]

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uadclaw"]

[tool.ruff]
line-length    = 100
target-version = "py312"
src            = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
asyncio_mode   = "auto"
testpaths      = ["tests"]
addopts        = "-n auto --dist loadscope"
timeout        = 30
timeout_method = "thread"
