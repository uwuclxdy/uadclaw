<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>log in · uadclaw</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%226%22%20fill%3D%22%231E1E2E%22%2F%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%2343ABE5%22%20stroke-width%3D%223.5%22%20stroke-linecap%3D%22round%22%3E%3Cpath%20d%3D%22M9%207c-1.5%205-1.5%2011%201%2018%22%2F%3E%3Cpath%20d%3D%22M16%206c-1%205.5-1%2011.5%201.5%2019%22%2F%3E%3Cpath%20d%3D%22M23%208c-.5%205-.5%2010.5%201.5%2016%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
  <link rel="stylesheet" href="/static/ui.css">
</head>
<body>
<main style="min-height:100vh;display:grid;place-items:center;padding:var(--space-6)">
  <div class="card" style="width:100%;max-width:360px">
    <div class="label" style="color:var(--accent);margin-bottom:var(--space-2)">uadclaw</div>
    <h1 style="font:550 var(--text-xl)/1.2 var(--font-sans);color:var(--text);letter-spacing:-0.02em;margin-bottom:var(--space-2)">log in</h1>
    <p style="font-size:var(--text-sm);color:var(--text-dim);margin-bottom:var(--space-6)">
      single user, one password.
    </p>

    {# `is defined` rather than a bare truth test: the environment runs StrictUndefined, so
       a missing optional raises instead of rendering blank. #}
    {% if error is defined and error %}
      <div class="callout callout-danger" style="margin-bottom:var(--space-5)">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next }}">
      <input class="input" type="password" name="password" placeholder="password"
             autocomplete="current-password" autofocus required
             style="width:100%;margin-bottom:var(--space-4)">
      <button class="btn btn-primary" type="submit" style="width:100%">log in</button>
    </form>
  </div>
</main>
</body>
</html>
