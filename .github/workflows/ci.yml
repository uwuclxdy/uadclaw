name: ci

on:
  push:
    branches: [mommy]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # Job/lease tests need a real Postgres: SKIP LOCKED semantics, lease contention and
      # crash reclaim cannot be proven against a mock. Password and port match conftest's
      # local-dev defaults (the loopback publish lives in docker-compose.override.yml, which
      # compose merges automatically) so no extra env vars are needed here. tests/conftest.py
      # fails loudly, not skip, when this is unreachable.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: uadclaw
          POSTGRES_PASSWORD: uadclaw
          POSTGRES_DB: uadclaw
        ports:
          - "55432:5432"
        options: >-
          --health-cmd "pg_isready -U uadclaw -d uadclaw"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          # Deliberately no python-version. That input exports UV_PYTHON, which is a hard
          # request rather than a hint: with `python-version: "3.12"` uv resolved the runner's
          # preinstalled /usr/bin/python3.12 (3.12.3) and then refused it against the project
          # floor instead of looking for a newer patch, failing run 31684038235 with "the
          # requested interpreter resolved to Python 3.12.3, which is incompatible".
          # `requires-python = ">=3.12.13"` is the repo's only interpreter request now and uv
          # downloads whatever satisfies it. That floor is a security boundary, not tidiness:
          # `ipaddress` reads a 6to4-tunnelled metadata address as public on 3.12.3 and
          # private on 3.12.13, so the SSRF gate held only on the interpreter the image ships.
          # There is no `.python-version` on purpose. An exact patch pin there is a hard
          # request the python:3.12-slim builder cannot meet the day Docker Hub rebases the
          # tag, which is what failed run 31807709082 once the image moved to 3.12.14.
          enable-cache: true

      - name: uv sync
        run: uv sync --frozen

      - name: ruff check
        run: uv run ruff check

      - name: ruff format --check
        run: uv run ruff format --check

      - name: pytest
        run: uv run pytest -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # GitHub-hosted runners build with BuildKit by default, so this only proves the
      # BuildKit path. `deploy.sh` builds over ssh on a host whose builder nobody asserts —
      # the Dockerfile writes its tarball sha256 twice for exactly that reason (`ADD
      # --checksum` is silently ignored by the legacy builder; the `sha256sum -c` inside the
      # `RUN` is the half that holds there). A green run here does not prove the
      # legacy-builder path.
      - name: docker build
        run: docker build .
